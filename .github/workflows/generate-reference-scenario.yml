name: Generate reference scenario

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-reference-scenario.yml'

permissions:
  contents: write
  actions: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy

      - name: Download existing OSM graph artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/graphs
          gh run download 34031808055 --repo "$GITHUB_REPOSITORY" --name osm-graphs --dir data/graphs

      - name: Generate deterministic NYC reference scenario
        run: python scripts/create_nyc_reference_scenario.py

      - name: Commit generated scenario
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scenarios/nyc_reference_12h_seed42.json data/scenarios/nyc_reference_12h_seed42_demand.json
          if git diff --cached --quiet; then
            echo "Reference scenario already up to date."
          else
            git commit -m "Generate NYC 12-hour reference scenario"
            git push
          fi
