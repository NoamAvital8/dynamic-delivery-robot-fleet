name: Run NYC corrected Benchmark 5 large test

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-tel-aviv-small-comparison.yml'

permissions:
  contents: read
  actions: read

jobs:
  benchmark5:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install numpy scipy networkx pytest
      - name: Compile and test optimized corrected B5
        env:
          PYTHONPATH: src
        run: |
          python -m py_compile scripts/run_nyc_benchmark5.py scripts/run_nyc_benchmark5_loss.py src/delivery_fleet/insertion_routing.py
          pytest -q
      - name: Download OSM graphs artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/graphs
          gh run download 34031808055 --repo "$GITHUB_REPOSITORY" --name osm-graphs --dir data/graphs
          ls -lh data/graphs/new_york_city.graphml
      - name: Run optimized corrected Benchmark 5 on NYC
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          mkdir -p nyc_b5_loss_results
          python scripts/run_nyc_benchmark5_loss.py --graph data/graphs/new_york_city.graphml --scenario data/scenarios/nyc_reference_12h_seed42.json --output nyc_b5_loss_results/b5_loss.json | tee nyc_b5_loss_results/b5_loss.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nyc-b5-loss-large-test-optimized
          path: |
            nyc_b5_loss_results/
