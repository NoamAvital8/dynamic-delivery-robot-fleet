name: Assemble Benchmark 5

on:
  push:
    paths:
      - '.github/workflows/assemble-benchmark5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble Benchmark 5 source
        run: |
          cat \
            scripts/_benchmark5_part1.pyfrag \
            scripts/_benchmark5_part2.pyfrag \
            scripts/_benchmark5_part3.pyfrag \
            scripts/_benchmark5_part4.pyfrag \
            > scripts/run_nyc_benchmark5.py
          python -m py_compile scripts/run_nyc_benchmark5.py src/delivery_fleet/insertion_routing.py
      - name: Commit assembled source and cleanup fragments
        run: |
          rm scripts/_benchmark5_part1.pyfrag \
             scripts/_benchmark5_part2.pyfrag \
             scripts/_benchmark5_part3.pyfrag \
             scripts/_benchmark5_part4.pyfrag \
             .github/workflows/assemble-benchmark5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/run_nyc_benchmark5.py src/delivery_fleet/insertion_routing.py .github/workflows/assemble-benchmark5.yml scripts/_benchmark5_part*.pyfrag
          git commit -m 'Assemble optimized Benchmark 5 reactive insertion'
          git push
