name: Build OSM graphs

on:
  push:
    paths:
      - '.github/workflows/build-osm-graphs.yml'
      - 'scripts/download_osm_graph.py'
      - 'scripts/initialize_demand_clusters.py'
      - 'src/delivery_fleet/spatial_demand.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore OSM response cache
        uses: actions/cache/restore@v4
        with:
          path: cache/
          key: osm-responses-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            osm-responses-v1-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install osmnx networkx scikit-learn

      - name: Download and build graphs
        run: |
          python scripts/download_osm_graph.py all --resume --attempts 4

      - name: Initialize demand clusters offline
        env:
          PYTHONPATH: src
        run: |
          python scripts/initialize_demand_clusters.py data/graphs/*.graphml

      - name: Show graph sizes
        run: |
          cat data/graphs/summary.json
          du -h data/graphs/*

      - name: Upload graphs artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: osm-graphs
          path: data/graphs/
          retention-days: 30

      - name: Save successful OSM responses even after a partial failure
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: cache/
          key: osm-responses-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
