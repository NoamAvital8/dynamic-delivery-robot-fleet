name: Run all NYC benchmarks

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/run-all-nyc-benchmarks.yml'

permissions:
  contents: read
  actions: read

jobs:
  benchmark1:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy networkx
      - name: Download NYC graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/graphs
          gh run download 34031808055 --repo "$GITHUB_REPOSITORY" --name osm-graphs --dir data/graphs
      - name: Run Benchmark 1
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python scripts/run_nyc_benchmark_fast.py | tee benchmark1.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allrun-benchmark1
          path: |
            benchmark_results.json
            benchmark1.log

